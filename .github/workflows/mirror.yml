name: Mirror to org repo

# Mirrors every push on this (personal) repo to the organization repo
# Chainreactions-ca/chainr-demo. Runs on GitHub's infrastructure using the
# ORG_MIRROR_TOKEN secret (a PAT with Contents:write on the org repo).

on:
  push:
    branches: ['**']
    tags: ['**']

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    # Only run on the source repo, never on the mirror (prevents loops).
    if: github.repository == 'kanbeiyan-arc/chain-demo'
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push ref to Chainreactions-ca/chainr-demo
        env:
          TOKEN: ${{ secrets.ORG_MIRROR_TOKEN }}
        run: |
          git push --force \
            "https://x-access-token:${TOKEN}@github.com/Chainreactions-ca/chainr-demo.git" \
            "HEAD:${GITHUB_REF}"
